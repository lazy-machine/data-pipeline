[project]
name = "data-pipeline"
version = "0.1.0"
description = "TOML-driven, checkpointed, process-isolated pipeline for data analysis and machine learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "packaging>=26.3",
]

[project.optional-dependencies]
# The data gate (packages/data-verify): `uv add --editable "../data-pipeline[verify]"`.
verify = ["data-verify"]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
    "duckdb>=1.1",       # data-verify's SQL assertions are tested too
]
examples = [
    "data-verify",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[tool.uv]
# Keep dependencies isolated in a dedicated virtual environment.
default-groups = ["dev", "examples"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
data-verify = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/data-verify/tests"]
